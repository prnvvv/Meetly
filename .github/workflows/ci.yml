name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    env:
      PYTHONPATH: .
      DATABASE_URL: sqlite:///./ci_test.db
      FRONTEND_URL: http://localhost:3000
      STUN_SERVER: stun:stun.l.google.com:19302
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint (syntax errors, undefined names, unused imports)
        run: |
          pip install ruff
          ruff check app scripts --select E9,F63,F7,F82,F401,F811,F841

      - name: Byte-compile all sources
        run: python -m compileall -q app tests

      - name: Run test suite
        run: python -m pytest -v --tb=short -rs

  backend-postgres:
    name: Backend on PostgreSQL (migrations + Row Level Security)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PYTHONPATH: .
      DATABASE_URL: sqlite:///./ci_test.db
      DATABASE_DIRECT_URL: postgresql://postgres:postgres@localhost:5432/postgres
      DATABASE_SSL_MODE: disable
      MEETLY_PG_TEST_URL: postgresql://postgres:postgres@localhost:5432/postgres
      MEETLY_PG_TEST_SSLMODE: disable
      FRONTEND_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Migrations apply to an empty PostgreSQL and match the models
        run: |
          python -m alembic upgrade head
          python -m alembic check

      - name: Migrations are reversible
        env:
          ALEMBIC_ALLOW_DOWNGRADE: "1"  # throwaway CI database
        run: |
          python -m alembic downgrade base
          python -m alembic upgrade head

      - name: Row Level Security tests (real role, real policies)
        run: python -m pytest tests/test_rls_postgres.py -v --tb=short

  frontend:
    name: Frontend tests
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_STUN_SERVER: stun:stun.l.google.com:19302
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
