# coturn config for Meetly. Replace the <PLACEHOLDERS>, or generate with the compose env below.
listening-port=3478
fingerprint
use-auth-secret
static-auth-secret=<TURN_SHARED_SECRET>
realm=<YOUR_DOMAIN_OR_PUBLIC_IP>
# Public IP of this machine (if it sits behind NAT, also set the private one: external-ip=PUBLIC/PRIVATE)
external-ip=<PUBLIC_IP>
min-port=49160
max-port=49200
total-quota=100
user-quota=12
no-multicast-peers
no-cli
no-tlsv1
no-tlsv1_1
# never relay into private networks
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
# For TLS (turns:) on 5349 add: tls-listening-port=5349, cert=..., pkey=... (needs a domain + Let's Encrypt)
