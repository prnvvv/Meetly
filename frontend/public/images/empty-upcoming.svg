<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" fill="none" stroke="#000" stroke-linecap="round" stroke-linejoin="round">
  <title>An empty calendar</title>
  <!-- ground squiggle -->
  <path d="M74 226 C 118 233, 160 231, 196 227 S 236 226, 250 229" stroke-width="5"/>
  <!-- calendar page -->
  <path d="M64 78 C 64 62, 74 54, 90 54 L 232 54 C 248 54, 258 62, 258 78 L 258 190 C 258 206, 248 214, 232 214 L 90 214 C 74 214, 64 206, 64 190 Z" fill="#fff" stroke-width="7"/>
  <!-- header band -->
  <path d="M64 102 L 64 78 C 64 62, 74 54, 90 54 L 232 54 C 248 54, 258 62, 258 78 L 258 102 Z" fill="#000" stroke-width="7"/>
  <!-- binding rings -->
  <rect x="104" y="30" width="15" height="40" rx="7.5" fill="#fff" stroke-width="6"/>
  <rect x="203" y="30" width="15" height="40" rx="7.5" fill="#fff" stroke-width="6"/>
  <!-- day grid -->
  <g stroke-width="4.5">
    <rect x="86" y="120" width="26" height="20" rx="6.5"/>
    <rect x="124" y="120" width="26" height="20" rx="6.5"/>
    <rect x="162" y="120" width="26" height="20" rx="6.5" fill="#000"/>
    <rect x="200" y="120" width="26" height="20" rx="6.5"/>
    <rect x="86" y="150" width="26" height="20" rx="6.5"/>
    <rect x="200" y="150" width="26" height="20" rx="6.5"/>
    <rect x="86" y="180" width="26" height="20" rx="6.5" fill="#000"/>
    <rect x="124" y="180" width="26" height="20" rx="6.5"/>
    <rect x="200" y="180" width="26" height="20" rx="6.5"/>
  </g>
  <!-- highlighted free day with a hand-drawn tick -->
  <circle cx="156" cy="168" r="25" fill="#fff" stroke-width="6.5"/>
  <path d="M143 169 L 152 178 L 171 157" stroke-width="7"/>
  <!-- emphasis strokes -->
  <path d="M276 66 L 296 48" stroke-width="6.5"/>
  <path d="M284 90 L 308 86" stroke-width="6.5"/>
  <path d="M268 40 L 270 18" stroke-width="6.5"/>
  <!-- little spark -->
  <path d="M34 120 L 34 144 M22 132 L 46 132" stroke-width="6"/>
  <path d="M40 176 L 40 188 M34 182 L 46 182" stroke-width="5"/>
</svg>
