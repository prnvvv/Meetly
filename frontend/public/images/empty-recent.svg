<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" fill="none" stroke="#000" stroke-linecap="round" stroke-linejoin="round">
  <title>A finished meeting and a history clock</title>
  <defs>
    <clipPath id="win">
      <path d="M50 88 L 250 88 L 250 164 C 250 178, 242 186, 228 186 L 72 186 C 58 186, 50 178, 50 164 Z"/>
    </clipPath>
  </defs>
  <!-- ground squiggle -->
  <path d="M62 226 C 110 233, 156 231, 198 227 S 246 226, 262 229" stroke-width="5"/>
  <!-- meeting window -->
  <path d="M50 70 C 50 56, 58 48, 72 48 L 228 48 C 242 48, 250 56, 250 70 L 250 164 C 250 178, 242 186, 228 186 L 72 186 C 58 186, 50 178, 50 164 Z" fill="#fff" stroke-width="7"/>
  <!-- window bar -->
  <path d="M50 88 L 50 70 C 50 56, 58 48, 72 48 L 228 48 C 242 48, 250 56, 250 70 L 250 88 Z" fill="#000" stroke-width="7"/>
  <g fill="#fff" stroke="none">
    <circle cx="72" cy="68" r="5.5"/>
    <circle cx="90" cy="68" r="5.5"/>
    <circle cx="108" cy="68" r="5.5"/>
  </g>

  <g clip-path="url(#win)">
    <!-- person 1: black top, bun-style hair -->
    <path d="M70 200 C 72 166, 90 154, 108 154 C 126 154, 144 166, 146 200 Z" fill="#000" stroke-width="5"/>
    <circle cx="108" cy="126" r="23" fill="#fff" stroke-width="6"/>
    <path d="M85 124 C 83 100, 99 94, 109 95 C 121 96, 133 104, 131 124 C 124 114, 114 110, 107 110 C 98 110, 89 114, 85 124 Z" fill="#000" stroke-width="4"/>
    <circle cx="100" cy="130" r="2.6" fill="#000" stroke="none"/>
    <circle cx="117" cy="130" r="2.6" fill="#000" stroke="none"/>
    <path d="M100 139 C 105 144, 112 144, 117 139" stroke-width="4"/>

    <!-- person 2: glasses, light top -->
    <path d="M150 200 C 152 166, 170 154, 188 154 C 206 154, 224 166, 226 200 Z" fill="#fff" stroke-width="5"/>
    <path d="M180 156 L 188 170 L 196 156" stroke-width="4.5"/>
    <circle cx="188" cy="126" r="23" fill="#fff" stroke-width="6"/>
    <path d="M165 120 C 166 100, 180 96, 190 96 C 202 96, 212 104, 211 120 C 203 110, 184 108, 165 120 Z" fill="#000" stroke-width="4"/>
    <circle cx="180" cy="128" r="6.5" stroke-width="3.5"/>
    <circle cx="196" cy="128" r="6.5" stroke-width="3.5"/>
    <path d="M186.5 128 L 189.5 128" stroke-width="3.5"/>
    <path d="M181 140 C 186 145, 194 145, 199 140" stroke-width="4"/>
  </g>

  <!-- history clock -->
  <circle cx="236" cy="178" r="34" fill="#fff" stroke-width="7"/>
  <path d="M236 157 L 236 179 L 251 188" stroke-width="7"/>
  <g stroke-width="4.5">
    <path d="M236 150 L 236 154"/>
    <path d="M263 178 L 259 178"/>
    <path d="M236 206 L 236 202"/>
    <path d="M209 178 L 213 178"/>
  </g>

  <!-- emphasis strokes -->
  <path d="M30 40 L 44 54" stroke-width="6.5"/>
  <path d="M20 68 L 40 72" stroke-width="6.5"/>
  <path d="M46 22 L 54 38" stroke-width="6.5"/>
  <path d="M286 92 L 286 114 M275 103 L 297 103" stroke-width="6"/>
</svg>
